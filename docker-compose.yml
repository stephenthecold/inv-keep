services:
  inv-keep:
    # Default: pull the published image from GitHub Container Registry.
    # Pin to a specific release by exporting INV_KEEP_VERSION=v1.11.0; `latest`
    # is the default (re-pull with `docker compose pull && up -d`).
    image: ghcr.io/stephenthecold/inv-keep:${INV_KEEP_VERSION:-latest}
    # For local development / bringing your own changes, use the dev override:
    #   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
    container_name: inv-keep
    restart: unless-stopped
    env_file:
      - .env
    # Direct access on APP_PORT. When using the bundled SSL proxy you can drop the
    # public mapping (Caddy reaches it over the internal network), but exposing it
    # is harmless for local/LAN use.
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # SQLite DB + uploaded brand assets persist here. Back this folder up.
      # See docs/BACKUPS.md.
      - ./data:/code/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional automatic-HTTPS reverse proxy. Enable with:  docker compose --profile ssl up -d
  # Requires HOSTNAME + ACME_EMAIL in .env, ports 80/443 free, and DNS pointing here.
  caddy:
    image: caddy:2
    container_name: inv-keep-caddy
    restart: unless-stopped
    profiles: ["ssl"]
    depends_on:
      - inv-keep
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # CADDY_CONFIG selects ./Caddyfile (Let's Encrypt, default) or
      # ./Caddyfile.custom (your own cert at ./certs/cert.pem + ./certs/key.pem).
      - ${CADDY_CONFIG:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:

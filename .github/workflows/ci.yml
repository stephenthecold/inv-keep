name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m py_compile app/*.py
      - name: Import app (smoke)
        env:
          DATABASE_URL: "sqlite:///./data/ci.db"
          SESSION_SECRET: "ci-secret"
        run: python -c "import app.main; print('import ok')"
      - name: Check JavaScript syntax
        run: node --check app/static/app.js
      - name: Lint shell installer
        run: bash -n install.sh

      - name: Technician hardware verification (admin enrol + verify-tech + rate-limit)
        env:
          DATABASE_URL: "sqlite:///./data/ci_techhw.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re
          from app.main import app
          from app.database import SessionLocal
          from app import settings_store as store
          from app.models import Technician
          from fastapi.testclient import TestClient
          c = TestClient(app)
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', c.get('/').text).group(1)
          H = {'X-CSRF-Token': tok}
          # Whitelabel default: flag absent/false until an admin turns it on.
          assert c.get('/mobile/whitelabel').json()['require_hardware_tech_verification'] is False
          # Admin enrols two techs with badge + NFC credentials.
          assert c.post('/settings/techs/add', data={'_csrf': tok, 'name': 'Jordan Lee', 'barcode_value': 'BADGE-001', 'nfc_uid': '04AABBCC'}, follow_redirects=False).status_code == 303
          assert c.post('/settings/techs/add', data={'_csrf': tok, 'name': 'Sam Rivera', 'barcode_value': 'BADGE-002', 'nfc_uid': ''}, follow_redirects=False).status_code == 303
          db = SessionLocal(); techs = {t.name: t for t in db.query(Technician).all()}
          j, s = techs['Jordan Lee'], techs['Sam Rivera']
          assert j.barcode_value == 'BADGE-001' and j.nfc_uid == '04AABBCC'
          assert s.barcode_value == 'BADGE-002' and s.nfc_uid is None; db.close()
          # Settings UI surfaces the credential inputs + the policy toggle.
          stext = c.get('/settings').text
          assert 'name=\"barcode_value\"' in stext and 'name=\"nfc_uid\"' in stext and 'name=\"require_hw\"' in stext
          # SEC: a duplicate credential is refused (friendly redirect, no row created, no 500).
          r = c.post('/settings/techs/add', data={'_csrf': tok, 'name': 'Dupe', 'barcode_value': 'BADGE-001'}, follow_redirects=False)
          assert r.status_code == 303
          db = SessionLocal(); assert db.query(Technician).filter(Technician.name == 'Dupe').count() == 0; db.close()
          # verify-tech resolves badge + NFC to the same tech; unknown / blank -> 404 unknown_credential.
          assert c.post('/kiosk/verify-tech', json={'credential': 'BADGE-001'}, headers=H).json()['tech_id'] == j.id
          assert c.post('/kiosk/verify-tech', json={'credential': '04AABBCC'}, headers=H).json()['tech_id'] == j.id
          r = c.post('/kiosk/verify-tech', json={'credential': 'NOPE'}, headers=H); assert r.status_code == 404 and r.json()['error'] == 'unknown_credential'
          assert c.post('/kiosk/verify-tech', json={'credential': '   '}, headers=H).status_code == 404
          # Deactivated tech's credential no longer resolves.
          c.post('/settings/techs/' + str(s.id) + '/save', data={'_csrf': tok, 'name': 'Sam Rivera', 'active': '', 'barcode_value': 'BADGE-002'})
          assert c.post('/kiosk/verify-tech', json={'credential': 'BADGE-002'}, headers=H).status_code == 404
          # Rate-limit ~10/min/IP: the 11th probe from one IP within the window is 429.
          hd = dict(H); hd['X-Forwarded-For'] = '203.0.113.7'
          codes = [c.post('/kiosk/verify-tech', json={'credential': 'x'}, headers=hd).status_code for _ in range(12)]
          assert codes.count(429) >= 1 and codes[:10].count(429) == 0, codes
          # Editing a tech can clear one credential (blank -> NULL) and keep the other.
          c.post('/settings/techs/' + str(j.id) + '/save', data={'_csrf': tok, 'name': 'Jordan Lee', 'active': 'on', 'barcode_value': '', 'nfc_uid': '04AABBCC'})
          db = SessionLocal(); jr = db.get(Technician, j.id); assert jr.barcode_value is None and jr.nfc_uid == '04AABBCC'; db.close()
          # Policy toggle flips the setting + is mirrored to the companion app.
          assert c.post('/settings/techs/verification', data={'_csrf': tok, 'require_hw': 'on'}, follow_redirects=False).status_code == 303
          assert store.get_bool(SessionLocal(), 'require_hardware_tech_verification') is True
          assert c.get('/mobile/whitelabel').json()['require_hardware_tech_verification'] is True
          print('technician hardware verification OK')
          "

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m py_compile app/*.py
      - name: Import app (smoke)
        env:
          DATABASE_URL: "sqlite:///./data/ci.db"
          # v1.8 startup check requires ≥32 chars and not the placeholder.
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: python -c "import app.main; print('import ok')"
      - name: Cart flow smoke (scan → set → submit → 200)
        env:
          DATABASE_URL: "sqlite:///./data/ci.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          # Seed a client + a part so the cart has something to scan.
          r = c.get('/')                              # mint csrf cookie
          assert r.status_code == 200, r.status_code
          import re
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', r.text).group(1)
          h = {'X-CSRF-Token': tok}
          r = c.post('/clients/add', data={'_csrf': tok, 'name': 'CI Co'}); assert r.status_code in (200, 303), r.status_code
          r = c.post('/parts/add',   data={'_csrf': tok, 'name': 'CI Cable', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '2', 'quantity_on_hand': '10'})
          assert r.status_code in (200, 303), r.status_code
          # Find the auto-generated barcode for the part we just made.
          parts = c.get('/api/search?q=CI+Cable').json()['results']
          assert parts, 'CI part not found via search'
          bc = parts[0]['barcode']
          r = c.post('/api/cart/scan', json={'barcode': bc, 'quantity': 2}, headers=h)
          assert r.json().get('ok') is True, r.json()
          r = c.post('/api/cart/set',  json={'client_id': 1, 'job_id': None}, headers=h)
          assert r.json().get('ok') is True, r.json()
          r = c.post('/api/cart/submit', headers=h)
          j = r.json()
          assert j.get('ok') is True, j
          assert j['order']['number'].startswith('ORD-'), j
          assert j['order']['lines'] == 1, j
          print('cart smoke ok ->', j['order']['number'])
          "
      - name: NaN geo rejected (security regression test)
        env:
          DATABASE_URL: "sqlite:///./data/ci2.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import json, re
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          r = c.get('/'); tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', r.text).group(1)
          h = {'X-CSRF-Token': tok}
          c.post('/clients/add', data={'_csrf': tok, 'name': 'CI Co'})
          c.post('/parts/add',   data={'_csrf': tok, 'name': 'CI Cable', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '2', 'quantity_on_hand': '10'})
          bc = c.get('/api/search?q=CI+Cable').json()['results'][0]['barcode']
          # NaN must NOT survive into the stored row — earlier bug.
          payload = '{\"barcode\":' + json.dumps(bc) + ',\"quantity\":1,\"lat\":NaN,\"lng\":NaN}'
          r = c.post('/api/cart/scan', content=payload, headers={**h, 'Content-Type':'application/json'})
          assert r.json().get('ok') is True, r.json()
          # The cart should report the scanned line with no geo poisoning.
          import sqlite3, os
          con = sqlite3.connect('./data/ci2.db')
          row = con.execute('SELECT lat, lng FROM transactions ORDER BY id DESC LIMIT 1').fetchone()
          assert row == (None, None), f'NaN bypass: stored {row}'
          print('NaN geo correctly rejected')
          "
      - name: CSRF rejected without token (security regression)
        env:
          DATABASE_URL: "sqlite:///./data/ci3.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          # Form POST without _csrf → HTML 403 rejection page
          r = c.post('/clients/add', data={'name': 'noToken'})
          assert r.status_code == 403, r.status_code
          assert 'CSRF' in r.text or 'csrf' in r.text, r.text[:200]
          # JSON POST without X-CSRF-Token → {ok:false,error:csrf} 403
          r = c.post('/api/cart/scan', json={'barcode': 'x'})
          assert r.status_code == 403, r.status_code
          assert r.json().get('error') == 'csrf', r.json()
          print('CSRF correctly rejects both form + JSON POSTs')
          "
      - name: XSS payload kept as data, never as HTML (regression)
        env:
          DATABASE_URL: "sqlite:///./data/ci4.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', c.get('/').text).group(1)
          h = {'X-CSRF-Token': tok}
          c.post('/clients/add', data={'_csrf': tok, 'name': 'XssCo'})
          # Push a malicious-name custom item with geo so it lands on /map.
          payload_name = '<img src=x onerror=\"window.__XSS__=1\">'
          files = {
              '_csrf': (None, tok),
              'name': (None, payload_name),
              'description': (None, 'r'),
              'unit_cost': (None, '1'),
              'unit_price': (None, '2'),
              'quantity': (None, '1'),
              'lat': (None, '40.0'),
              'lng': (None, '-105.0'),
              'geo_accuracy_m': (None, '10'),
          }
          r = c.post('/api/cart/custom', files=files, headers=h)
          assert r.json().get('ok') is True, r.json()
          c.post('/api/cart/set',    json={'client_id': 1, 'job_id': None}, headers=h)
          c.post('/api/cart/submit', headers=h)
          # The map page embeds markers via Jinja \`| tojson\`, which escapes
          # < and > as \\u003c / \\u003e. The literal '<img' must NOT appear
          # anywhere in the response (else an HTML parser would execute it);
          # the unicode-escaped form proves the payload survived as DATA.
          page = c.get('/map').text
          assert payload_name not in page, 'raw <img> payload found in /map HTML!'
          assert '<img' not in page, 'a stray <img> tag rendered — XSS vector!'
          esc = chr(92) + 'u003c' + 'img'  # \\u003cimg without literal backslashes that bash would eat
          assert esc in page, 'expected unicode-escaped <img payload in markers JSON'
          print('XSS payload only present as JSON-escaped data, not parseable HTML')
          "
      - name: Kiosk PIN charge-out (feature smoke)
        env:
          DATABASE_URL: "sqlite:///./data/ci_kiosk.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
        run: |
          python -c "
          import re
          from app.main import app
          from app.database import SessionLocal
          from app import settings_store as store
          db = SessionLocal()
          store.set(db, 'auth_mode', 'oidc')
          store.set(db, 'oidc_discovery_url', 'https://x/.well-known/openid-configuration')
          store.set(db, 'oidc_client_id', 'x')
          store.set(db, 'kiosk_enabled', '1')
          store.set(db, 'kiosk_pin', '1234')
          db.commit(); db.close()
          from fastapi.testclient import TestClient
          c = TestClient(app, base_url='https://testserver')
          r = c.get('/welcome'); assert 'Kiosk PIN' in r.text
          tok = re.search(r'name=\"_csrf\" value=\"([^\"]+)\"', r.text).group(1)
          # CSRF required
          assert c.post('/kiosk/login', data={'pin': '1234'}, follow_redirects=False).status_code == 403
          # Wrong PIN bounces back
          r = c.post('/kiosk/login', data={'_csrf': tok, 'pin': 'wrong'}, follow_redirects=False)
          assert r.status_code == 303 and 'Incorrect' in r.headers['location']
          # Right PIN grants session
          r = c.post('/kiosk/login', data={'_csrf': tok, 'pin': '1234'}, follow_redirects=False)
          assert r.status_code == 303 and r.headers['location'] == '/'
          # Scan page OK with banner
          assert 'Kiosk charge-out mode' in c.get('/').text
          # Locked-down: /parts, /settings, /users, /audit, /report, /map are 403
          for p in ['/parts','/categories','/clients','/jobs','/settings','/users','/audit','/report','/map']:
              assert c.get(p, follow_redirects=False).status_code == 403, p
          assert c.get('/transactions').status_code == 200
          # Disabling kiosk_enabled invalidates the live session
          db = SessionLocal(); store.set(db, 'kiosk_enabled', '0'); db.commit(); db.close()
          assert c.get('/', follow_redirects=False).status_code in (302, 303, 401)
          print('kiosk PIN flow OK')
          "
      - name: Admin impersonation (feature smoke)
        env:
          DATABASE_URL: "sqlite:///./data/ci_imp.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          r = c.get('/'); tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', r.text).group(1)
          # Admin sees the View as UI
          assert 'View as' in r.text
          # Impersonate Operator -> settings blocked
          assert c.post('/impersonate', data={'_csrf': tok, 'role': 'Operator'}, follow_redirects=False).status_code == 303
          assert c.get('/settings', follow_redirects=False).status_code == 403
          assert 'Viewing as Operator' in c.get('/').text
          # Stop -> back to admin
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', c.get('/').text).group(1)
          c.post('/impersonate', data={'_csrf': tok, 'role': 'stop'}, follow_redirects=False)
          assert c.get('/settings').status_code == 200
          # Impersonating Admin role rejected as no-op
          r = c.post('/impersonate', data={'_csrf': tok, 'role': 'Admin'}, follow_redirects=False)
          assert r.status_code == 303 and 'no-op' in r.headers['location']
          # Unknown role rejected
          r = c.post('/impersonate', data={'_csrf': tok, 'role': 'Bogus'}, follow_redirects=False)
          assert r.status_code == 303 and 'Unknown' in r.headers['location']
          print('impersonation flow OK')
          "
      - name: Per-location stock + transfers (feature smoke)
        env:
          DATABASE_URL: "sqlite:///./data/ci_loc.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re
          from fastapi.testclient import TestClient
          from app.main import app
          from app.database import SessionLocal
          from app.models import Location, StockLevel, Part
          c = TestClient(app)
          r = c.get('/'); tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', r.text).group(1)
          h = {'X-CSRF-Token': tok}
          c.post('/parts/add', data={'_csrf': tok, 'name': 'Widget', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '2', 'quantity_on_hand': '10'})
          db = SessionLocal()
          p = db.query(Part).first()
          db.close()
          # Seeded stock at Main = 10
          db = SessionLocal()
          sl = db.query(StockLevel).filter(StockLevel.part_id == p.id).all()
          assert any(s.quantity == 10 for s in sl), 'seed missing'
          db.close()
          # Add Truck 1
          assert c.post('/locations/add', data={'_csrf': tok, 'name': 'Truck 1'}, follow_redirects=False).status_code == 303
          db = SessionLocal(); truck_id = db.query(Location).filter(Location.name == 'Truck 1').first().id; main_id = db.query(Location).filter(Location.name == 'Main').first().id; db.close()
          # Restock 5 at Truck
          c.post('/parts/' + str(p.id) + '/restock', data={'_csrf': tok, 'amount': '5', 'location_id': str(truck_id)})
          db = SessionLocal()
          lvl = {sl.location_id: sl.quantity for sl in db.query(StockLevel).filter(StockLevel.part_id == p.id).all()}
          assert lvl[truck_id] == 5 and lvl[main_id] == 10
          assert db.query(Part).first().quantity_on_hand == 15
          db.close()
          # Transfer 3 Main -> Truck
          r = c.post('/transfers/new', data={'_csrf': tok, 'from_location_id': str(main_id), 'to_location_id': str(truck_id), 'part_id': str(p.id), 'quantity': '3'}, follow_redirects=False)
          assert r.status_code == 303
          db = SessionLocal()
          lvl = {sl.location_id: sl.quantity for sl in db.query(StockLevel).filter(StockLevel.part_id == p.id).all()}
          assert lvl[main_id] == 7 and lvl[truck_id] == 8, lvl
          assert db.query(Part).first().quantity_on_hand == 15
          db.close()
          # Transfer with insufficient stock at source is rejected before mutating
          r = c.post('/transfers/new', data={'_csrf': tok, 'from_location_id': str(truck_id), 'to_location_id': str(main_id), 'part_id': str(p.id), 'quantity': '999'}, follow_redirects=False)
          assert r.status_code == 303 and 'doesn' in r.headers['location'].lower()
          db = SessionLocal()
          lvl = {sl.location_id: sl.quantity for sl in db.query(StockLevel).filter(StockLevel.part_id == p.id).all()}
          assert lvl[main_id] == 7 and lvl[truck_id] == 8, 'transfer should be no-op when rejected'
          db.close()
          # Scan from Truck only — set cart location, then scan
          c.post('/clients/add', data={'_csrf': tok, 'name': 'Demo Co'})
          bc = c.get('/api/search?q=Widget').json()['results'][0]['barcode']
          # First scan starts a cart (defaults to Main); switch location, then scan again so we test both paths.
          assert c.post('/api/cart/scan', json={'barcode': bc, 'quantity': 1}, headers=h).json()['ok']
          assert c.post('/api/cart/set', json={'client_id': 1, 'job_id': None, 'location_id': truck_id}, headers=h).json()['ok']
          assert c.post('/api/cart/scan', json={'barcode': bc, 'quantity': 2}, headers=h).json()['ok']
          db = SessionLocal()
          lvl = {sl.location_id: sl.quantity for sl in db.query(StockLevel).filter(StockLevel.part_id == p.id).all()}
          assert lvl[main_id] == 6 and lvl[truck_id] == 6, lvl
          db.close()
          # Insufficient stock at location returns 409-style json with the location name
          r = c.post('/api/cart/scan', json={'barcode': bc, 'quantity': 999}, headers=h)
          j = r.json()
          assert j['ok'] is False and j['error'] == 'insufficient_stock'
          # Archive blocked while stock > 0
          r = c.post('/locations/' + str(truck_id) + '/archive', data={'_csrf': tok}, follow_redirects=False)
          assert r.status_code == 303 and 'Move' in r.headers['location']
          # Submit, then verify /transactions and /report render
          assert c.post('/api/cart/submit', headers=h).json()['ok']
          assert c.get('/transactions').status_code == 200
          assert c.get('/report').status_code == 200
          assert c.get('/locations').status_code == 200
          assert c.get('/transfers').status_code == 200
          print('per-location stock + transfers flow OK')
          "
      - name: Check JavaScript syntax
        run: node --check app/static/app.js
      - name: Lint shell installer
        run: bash -n install.sh

name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Cap the whole job so a hung step fails fast instead of holding a runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Byte-compile
        run: python -m py_compile app/*.py
      - name: Import app (smoke)
        env:
          DATABASE_URL: "sqlite:///./data/ci.db"
          # v1.8 startup check requires ≥32 chars and not the placeholder.
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: python -c "import app.main; print('import ok')"
      - name: Cart flow smoke (scan → set → submit → 200)
        env:
          DATABASE_URL: "sqlite:///./data/ci.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          # Seed a client + a part so the cart has something to scan.
          r = c.get('/')                              # mint csrf cookie
          assert r.status_code == 200, r.status_code
          import re
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', r.text).group(1)
          h = {'X-CSRF-Token': tok}
          r = c.post('/clients/add', data={'_csrf': tok, 'name': 'CI Co'}); assert r.status_code in (200, 303), r.status_code
          r = c.post('/parts/add',   data={'_csrf': tok, 'name': 'CI Cable', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '2', 'quantity_on_hand': '10'})
          assert r.status_code in (200, 303), r.status_code
          # Find the auto-generated barcode for the part we just made.
          parts = c.get('/api/search?q=CI+Cable').json()['results']
          assert parts, 'CI part not found via search'
          bc = parts[0]['barcode']
          r = c.post('/api/cart/scan', json={'barcode': bc, 'quantity': 2}, headers=h)
          assert r.json().get('ok') is True, r.json()
          r = c.post('/api/cart/set',  json={'client_id': 1, 'job_id': None}, headers=h)
          assert r.json().get('ok') is True, r.json()
          r = c.post('/api/cart/submit', headers=h)
          j = r.json()
          assert j.get('ok') is True, j
          assert j['order']['number'].startswith('ORD-'), j
          assert j['order']['lines'] == 1, j
          print('cart smoke ok ->', j['order']['number'])
          "
      - name: Inline job-on-checkout (feature smoke)
        env:
          DATABASE_URL: "sqlite:///./data/ci_jobnew.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re
          from fastapi.testclient import TestClient
          from app.main import app
          from app.database import SessionLocal
          from app.models import Job, Order, Transaction
          c = TestClient(app)
          r = c.get('/'); tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', r.text).group(1)
          h = {'X-CSRF-Token': tok}
          c.post('/clients/add', data={'_csrf': tok, 'name': 'JobCo'})
          c.post('/parts/add',   data={'_csrf': tok, 'name': 'JobCable', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '2', 'quantity_on_hand': '10'})
          bc = c.get('/api/search?q=JobCable').json()['results'][0]['barcode']
          # Scan an item, set the client, then create a job mid-cart.
          assert c.post('/api/cart/scan', json={'barcode': bc, 'quantity': 1}, headers=h).json()['ok']
          # No client yet -> refused.
          r = c.post('/api/cart/job/new', json={'name': 'Too early'}, headers=h)
          assert r.json() == {'ok': False, 'error': 'no_client'}, r.json()
          assert c.post('/api/cart/set', json={'client_id': 1, 'job_id': None}, headers=h).json()['ok']
          # Empty name refused.
          assert c.post('/api/cart/job/new', json={'name': '   '}, headers=h).json()['error'] == 'name_required'
          # Create the job and confirm it attaches to the cart + open lines.
          r = c.post('/api/cart/job/new', json={'name': 'Kitchen remodel'}, headers=h)
          j = r.json()
          assert j['ok'] is True and j['job']['name'] == 'Kitchen remodel', j
          assert j['cart']['job_id'] == j['job']['id'], j
          db = SessionLocal()
          job = db.query(Job).filter(Job.name == 'Kitchen remodel').first()
          assert job and job.client_id == 1
          cart = db.query(Order).filter(Order.status == 'open').first()
          assert cart.job_id == job.id
          assert all(t.job_id == job.id for t in db.query(Transaction).filter(Transaction.order_id == cart.id).all())
          db.close()
          # CSRF still enforced on the new route.
          assert c.post('/api/cart/job/new', json={'name': 'x'}).status_code == 403
          print('inline job-on-checkout OK ->', job.id)
          "
      - name: checkout perm + cost-gate (security regression)
        env:
          DATABASE_URL: "sqlite:///./data/ci_perm.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re
          from app import rbac
          # The real charge-out path (POST /api/cart/*) requires \`checkout\`, not
          # the bare \`view\` it used to fall through to. GET stays at \`view\`.
          assert rbac.required_perm('/api/cart/scan', 'POST') == 'checkout'
          assert rbac.required_perm('/api/cart/submit', 'POST') == 'checkout'
          assert rbac.required_perm('/api/cart/job/new', 'POST') == 'checkout'
          assert rbac.required_perm('/api/cart', 'GET') == 'view'
          assert rbac.required_perm('/api/void/3', 'POST') == 'checkout'
          # Only admin / see_cost holders may see our cost — Kiosk + Operator
          # (view/view_catalog/checkout) must not.
          from app.main import app, _can_see_cost, _cart_payload
          assert _can_see_cost({'is_admin': True})
          assert _can_see_cost({'perms': {'see_cost'}})
          assert not _can_see_cost({'perms': {'view', 'view_catalog', 'checkout'}})
          assert not _can_see_cost(None)
          from app.database import SessionLocal
          from app.models import Order
          from fastapi.testclient import TestClient
          c = TestClient(app)
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', c.get('/').text).group(1)
          h = {'X-CSRF-Token': tok}
          c.post('/clients/add', data={'_csrf': tok, 'name': 'Co'})
          c.post('/parts/add', data={'_csrf': tok, 'name': 'Cable', 'type': 'bulk', 'unit_cost': '1.5', 'unit_price': '2', 'quantity_on_hand': '10'})
          bc = c.get('/api/search?q=Cable').json()['results'][0]
          assert bc['unit_cost'] == 1.5  # admin sees cost
          assert c.post('/api/cart/scan', json={'barcode': bc['barcode'], 'quantity': 2}, headers=h).json()['ok']
          db = SessionLocal(); cart = db.query(Order).filter(Order.status == 'open').first()
          hidden = _cart_payload(db, cart, see_cost=False)
          shown = _cart_payload(db, cart, see_cost=True)
          db.close()
          # No-see_cost payload carries zeroed cost/margin; see_cost payload keeps them.
          assert hidden['cost'] == 0 and hidden['margin'] == 0 and hidden['lines'][0]['unit_cost'] == 0.0, hidden
          assert shown['cost'] > 0 and shown['lines'][0]['unit_cost'] == 1.5, shown
          print('checkout perm + cost-gate OK')
          "
      - name: Negative restock + category cycle rejected (regression)
        env:
          DATABASE_URL: "sqlite:///./data/ci_guard.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re
          from urllib.parse import unquote
          from fastapi.testclient import TestClient
          from app.main import app
          from app.database import SessionLocal
          from app.models import Part, Category
          c = TestClient(app)
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', c.get('/').text).group(1)
          c.post('/parts/add', data={'_csrf': tok, 'name': 'W', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '2', 'quantity_on_hand': '10'})
          db = SessionLocal(); pid = db.query(Part).first().id; db.close()
          # Negative restock is rejected and does not mutate stock.
          r = c.post('/parts/' + str(pid) + '/restock', data={'_csrf': tok, 'amount': '-9999'}, follow_redirects=False)
          assert r.status_code == 303 and 'positive' in unquote(r.headers['location']).lower()
          db = SessionLocal(); assert db.query(Part).first().quantity_on_hand == 10; db.close()
          # Category cycle (parent set to a descendant) is rejected; bad int doesn't 500.
          c.post('/categories/add', data={'_csrf': tok, 'name': 'A'})
          db = SessionLocal(); a = db.query(Category).filter(Category.name == 'A').first().id; db.close()
          c.post('/categories/add', data={'_csrf': tok, 'name': 'B', 'parent_id': str(a)})
          db = SessionLocal(); b = db.query(Category).filter(Category.name == 'B').first().id; db.close()
          r = c.post('/categories/' + str(a) + '/edit', data={'_csrf': tok, 'name': 'A', 'parent_id': str(b)}, follow_redirects=False)
          assert r.status_code == 303 and 'sub-category' in unquote(r.headers['location']).lower()
          db = SessionLocal(); assert db.get(Category, a).parent_id is None; db.close()
          assert c.post('/categories/' + str(b) + '/edit', data={'_csrf': tok, 'name': 'B', 'parent_id': 'abc'}, follow_redirects=False).status_code == 303
          print('negative restock + category cycle guards OK')
          "
      - name: Category manage actions return to /parts (regression)
        env:
          DATABASE_URL: "sqlite:///./data/ci_catnext.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re
          from fastapi.testclient import TestClient
          from app.main import app
          from app.database import SessionLocal
          from app.models import Category
          c = TestClient(app)
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', c.get('/').text).group(1)
          c.post('/categories/add', data={'_csrf': tok, 'name': 'Wiring'})
          db = SessionLocal(); wid = db.query(Category).filter(Category.name == 'Wiring').first().id; db.close()
          nxt = '/parts?cat=' + str(wid) + '&manage=1'
          # The /parts manage view embeds next= in the category admin forms.
          mv = c.get('/parts?manage=1&cat=' + str(wid)).text
          assert ('name=\"next\" value=\"/parts?cat=' + str(wid) + '&amp;manage=1\"') in mv, 'manage forms missing next='
          # The manage-mode category buttons must NOT use inline onclick with a
          # tojson'd name (double quotes break a double-quoted onclick attr, so
          # clicks did nothing). They're data-attribute buttons + listeners now.
          c.post('/categories/add', data={'_csrf': tok, 'name': 'Router/Gateway', 'parent_id': str(wid)})
          mv = c.get('/parts?manage=1&cat=' + str(wid)).text
          assert 'onclick=\"openCatAdd' not in mv and 'onclick=\"openCatRename' not in mv, 'broken inline onclick present'
          assert 'cat-add-btn' in mv and 'cat-rename-btn' in mv and \"querySelectorAll('.cat-add-btn')\" in mv
          # add-sub / rename / delete driven from /parts return to that /parts view.
          r = c.post('/categories/add', data={'_csrf': tok, 'name': 'Ethernet', 'parent_id': str(wid), 'next': nxt}, follow_redirects=False)
          assert r.headers['location'].startswith(nxt), r.headers['location']
          db = SessionLocal(); eid = db.query(Category).filter(Category.name == 'Ethernet').first().id; db.close()
          assert c.post('/categories/' + str(eid) + '/edit', data={'_csrf': tok, 'name': 'Cat6', 'parent_id': str(wid), 'next': nxt}, follow_redirects=False).headers['location'].startswith(nxt)
          assert c.post('/categories/' + str(eid) + '/delete', data={'_csrf': tok, 'next': nxt}, follow_redirects=False).headers['location'].startswith(nxt)
          # No next (the dedicated /categories page) still lands on /categories.
          assert c.post('/categories/add', data={'_csrf': tok, 'name': 'Solo'}, follow_redirects=False).headers['location'].startswith('/categories')
          # A non-/parts next is ignored (open-redirect guard) -> /categories.
          assert c.post('/categories/add', data={'_csrf': tok, 'name': 'Evil', 'next': 'https://evil.test/x'}, follow_redirects=False).headers['location'].startswith('/categories')
          print('category manage return-to-/parts OK')
          "
      - name: Transactions rebuild keeps location_id + receipt_id (migration regression)
        env:
          # Importing app.database runs a module-level makedirs on the DB path;
          # point it at a writable location so the default /code/data isn't used.
          DATABASE_URL: "sqlite:///./data/ci_mig.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
        run: |
          python -c "
          import sqlite3
          from sqlalchemy import create_engine
          from app import database
          path = './data/ci_mig.db'
          import os
          if os.path.exists(path): os.remove(path)
          con = sqlite3.connect(path)
          # Pre-v1.9 shape: customer_id NOT NULL, with the later additive columns present.
          con.executescript('''
            CREATE TABLE transactions (
              id INTEGER PRIMARY KEY, customer_id INTEGER NOT NULL, job_id INTEGER, part_id INTEGER NOT NULL,
              order_id INTEGER, quantity INTEGER NOT NULL DEFAULT 1, unit_cost_at_time NUMERIC NOT NULL DEFAULT 0,
              unit_price_at_time NUMERIC NOT NULL DEFAULT 0, scanned_by TEXT DEFAULT '', note TEXT DEFAULT '',
              voided BOOLEAN NOT NULL DEFAULT 0, created_at DATETIME, lat REAL, lng REAL, geo_accuracy_m REAL,
              location_id INTEGER, receipt_id TEXT );
            INSERT INTO transactions (id,customer_id,part_id,quantity,location_id,receipt_id) VALUES (1,7,3,2,42,'rcpt_abc');
          ''')
          con.commit(); con.close()
          eng = create_engine('sqlite:///' + path)
          with eng.begin() as conn:
              database._relax_transactions_customer_id(conn)
          con = sqlite3.connect(path)
          info = list(con.execute('PRAGMA table_info(transactions)'))
          cols = {r[1] for r in info}
          assert 'location_id' in cols and 'receipt_id' in cols, cols
          cust = [r for r in info if r[1] == 'customer_id'][0]
          assert cust[3] == 0, 'customer_id should be nullable after rebuild'
          row = con.execute('SELECT customer_id,part_id,quantity,location_id,receipt_id FROM transactions WHERE id=1').fetchone()
          assert row == (7, 3, 2, 42, 'rcpt_abc'), row
          con.close()
          print('transactions rebuild preserves location_id/receipt_id OK')
          "
      - name: Mobile PIN brute-force throttle (security regression)
        env:
          DATABASE_URL: "sqlite:///./data/ci_throttle.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          from app.database import SessionLocal
          from app.models import KioskPin
          db = SessionLocal(); db.add(KioskPin(label='T', pin='9876', kiosk_username='alice', active=True)); db.commit(); db.close()
          c = TestClient(app)
          codes = [c.post('/mobile/auth/token', json={'pin': '0000'}).status_code for _ in range(5)]
          assert codes == [401] * 5, codes
          r = c.post('/mobile/auth/token', json={'pin': '0000'})
          assert r.status_code == 429 and r.headers.get('Retry-After'), (r.status_code, dict(r.headers))
          # Even the correct PIN is refused while the IP is locked out.
          assert c.post('/mobile/auth/token', json={'pin': '9876'}).status_code == 429
          print('mobile PIN throttle OK')
          "
      - name: Mobile order idempotency + kiosk token revocation (regression)
        env:
          DATABASE_URL: "sqlite:///./data/ci_idem.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re, sqlite3
          from fastapi.testclient import TestClient
          from app.main import app
          from app.database import SessionLocal
          from app.models import KioskPin, Location, Client, Part, MobileSession
          c = TestClient(app)
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', c.get('/').text).group(1)
          c.post('/clients/add', data={'_csrf': tok, 'name': 'Acme'})
          c.post('/parts/add', data={'_csrf': tok, 'name': 'Cable', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '2', 'quantity_on_hand': '10'})
          db = SessionLocal(); loc = db.query(Location).first().id; cl = db.query(Client).first().id; pid = db.query(Part).first().id
          db.add(KioskPin(label='T', pin='9876', kiosk_username='alice', location_id=loc, active=True)); db.commit()
          pin_id = db.query(KioskPin).first().id; db.close()
          # COR-5: the idempotency unique index exists and blocks a duplicate (cid, created_by).
          con = sqlite3.connect('./data/ci_idem.db')
          assert 'uq_order_action' in [r[1] for r in con.execute('PRAGMA index_list(orders)')]
          con.close()
          tkn = c.post('/mobile/auth/token', json={'pin': '9876'}).json()['token']
          bh = {'Authorization': 'Bearer ' + tkn}
          body = {'client_action_id': 'act-1', 'customer_id': cl, 'location_id': loc, 'lines': [{'item_id': pid, 'qty': 1}]}
          r1 = c.post('/mobile/orders', json=body, headers=bh); assert r1.status_code == 201, r1.text
          oid = r1.json()['order_id']
          r2 = c.post('/mobile/orders', json=body, headers=bh)
          assert r2.status_code == 200 and r2.json()['order_id'] == oid and r2.json()['idempotent_replay'] is True, r2.json()
          con = sqlite3.connect('./data/ci_idem.db')
          try:
              con.execute(\"INSERT INTO orders (created_by, client_action_id, status) VALUES ('alice','act-1','submitted')\"); con.commit()
              raise SystemExit('duplicate (cid, created_by) insert should have been blocked')
          except sqlite3.IntegrityError:
              pass
          con.close()
          # COR-7: deleting the kiosk PIN revokes its live mobile tokens.
          db = SessionLocal(); assert db.query(MobileSession).count() == 1; db.close()
          assert c.post('/settings/kiosk/' + str(pin_id) + '/delete', data={'_csrf': tok}, follow_redirects=False).status_code == 303
          db = SessionLocal(); assert db.query(MobileSession).count() == 0; db.close()
          assert c.get('/mobile/locations', headers=bh).status_code == 401
          print('mobile idempotency + token revocation OK')
          "
      - name: parts_add input validation + emailer rounding (regression)
        env:
          DATABASE_URL: "sqlite:///./data/ci_inval.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re, datetime
          from urllib.parse import unquote
          from fastapi.testclient import TestClient
          from app import emailer, reports
          from app.main import app
          from app.database import SessionLocal
          from app.models import Part
          c = TestClient(app)
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', c.get('/').text).group(1)
          # COR-8: negative price / quantity rejected, no row created.
          r = c.post('/parts/add', data={'_csrf': tok, 'name': 'Neg', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '-5', 'quantity_on_hand': '1'}, follow_redirects=False)
          assert r.status_code == 303 and 'positive' in unquote(r.headers['location']).lower()
          r = c.post('/parts/add', data={'_csrf': tok, 'name': 'NegQ', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '5', 'quantity_on_hand': '-3'}, follow_redirects=False)
          assert r.status_code == 303 and 'negative' in unquote(r.headers['location']).lower()
          db = SessionLocal(); assert db.query(Part).count() == 0; db.close()
          # COR-6: emailed report uses the ceil-cents helper, consistent with the CSV/UI.
          c.post('/clients/add', data={'_csrf': tok, 'name': 'Acme'})
          c.post('/parts/add', data={'_csrf': tok, 'name': 'Widget', 'type': 'bulk', 'unit_cost': '0.75', 'unit_price': '1.50', 'quantity_on_hand': '9'})
          bc = c.get('/api/search?q=Widget').json()['results'][0]['barcode']
          h = {'X-CSRF-Token': tok}
          assert c.post('/api/cart/scan', json={'barcode': bc, 'quantity': 3}, headers=h).json()['ok']
          assert c.post('/api/cart/set', json={'client_id': 1, 'job_id': None}, headers=h).json()['ok']
          assert c.post('/api/cart/submit', headers=h).json()['ok']
          db = SessionLocal()
          now = datetime.datetime.utcnow(); start = now.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
          end = (start + datetime.timedelta(days=40)).replace(day=1)
          html = emailer.build_report_html(db, start, end)
          report, totals = reports.build_report_range(db, start, end)
          db.close()
          assert '4.50' in html and '2.25' in html, html
          assert reports._c(totals['charge']) == '4.50' and reports._c(totals['margin']) == '2.25'
          print('parts_add validation + emailer rounding OK')
          "
      - name: Hot-path indexes + no N+1 (perf regression)
        env:
          DATABASE_URL: "sqlite:///./data/ci_perf.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"
          DISABLE_AUTH: "1"
        run: |
          python -c "
          import re, sqlite3
          from sqlalchemy import event
          from fastapi.testclient import TestClient
          # Importing app.main runs create_all + ensure_columns on the DB.
          from app.main import app
          from app.database import engine, SessionLocal
          from app.models import KioskPin, Location, Client, Part
          # 1. The hot-path indexes exist on a fresh DB.
          con = sqlite3.connect('./data/ci_perf.db')
          def idxs(t): return {r[1] for r in con.execute('PRAGMA index_list(' + t + ')')}
          ti, ai, ji = idxs('transactions'), idxs('audit_log'), idxs('jobs')
          assert {'ix_transactions_created_at', 'ix_transactions_customer_id', 'ix_transactions_part_id'} <= ti, ti
          assert {'ix_audit_log_created_at', 'ix_audit_log_action'} <= ai, ai
          assert 'ix_jobs_client_id' in ji, ji
          con.close()
          # 2. Mobile recent-orders query count is constant (no per-order N+1).
          cnt = [0]
          @event.listens_for(engine, 'before_cursor_execute')
          def _c(conn, cur, stmt, params, ctx, many):
              if stmt.lstrip().upper().startswith('SELECT'): cnt[0] += 1
          def count(fn): cnt[0] = 0; fn(); return cnt[0]
          c = TestClient(app)
          tok = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', c.get('/').text).group(1)
          for i in range(6):
              c.post('/clients/add', data={'_csrf': tok, 'name': 'Cli' + str(i)})
              c.post('/parts/add', data={'_csrf': tok, 'name': 'Part' + str(i), 'type': 'bulk', 'unit_cost': '1', 'unit_price': '2', 'quantity_on_hand': '50'})
          db = SessionLocal(); loc = db.query(Location).first().id
          db.add(KioskPin(label='T', pin='9876', kiosk_username='alice', location_id=loc, active=True)); db.commit()
          clients = [x.id for x in db.query(Client).all()]; pids = [p.id for p in db.query(Part).all()]; db.close()
          bh = {'Authorization': 'Bearer ' + c.post('/mobile/auth/token', json={'pin': '9876'}).json()['token']}
          for i in range(2):

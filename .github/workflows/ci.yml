          c.post('/parts/add', data={'_csrf': tok, 'name': 'Cable A', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '2.50', 'quantity_on_hand': '10'})
          c.post('/parts/add', data={'_csrf': tok, 'name': 'Cable B', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '3.00', 'quantity_on_hand': '5'})
          c.post('/parts/add', data={'_csrf': tok, 'name': 'Widget X', 'type': 'bulk', 'unit_cost': '1', 'unit_price': '4.00', 'quantity_on_hand': '20'})
          c.post('/clients/add', data={'_csrf': tok, 'name': 'Acme Corp'})
          c.post('/clients/add', data={'_csrf': tok, 'name': 'Beta Industries'})
          c.post('/locations/add', data={'_csrf': tok, 'name': 'Van 3'})
          db = SessionLocal()
          loc_main = db.query(Location).filter(Location.name == 'Main').first().id
          loc_van = db.query(Location).filter(Location.name == 'Van 3').first().id
          acme_id = db.query(Client).filter(Client.name == 'Acme Corp').first().id
          beta_id = db.query(Client).filter(Client.name == 'Beta Industries').first().id
          ca = db.query(Part).filter(Part.name == 'Cable A').first(); ca_id, ca_bc = ca.id, ca.barcode
          cb_id = db.query(Part).filter(Part.name == 'Cable B').first().id
          db.add(KioskPin(label='Tech 1', pin='1234', kiosk_username='alice', location_id=loc_main, active=True))
          db.add(KioskPin(label='Tech 2', pin='5678', kiosk_username='bob', location_id=loc_van, active=True))
          db.commit(); db.close()
          tok1 = c.post('/mobile/auth/token', json={'pin': '1234'}).json()['token']
          tok2 = c.post('/mobile/auth/token', json={'pin': '5678'}).json()['token']
          h1 = {'Authorization': 'Bearer ' + tok1}
          h2 = {'Authorization': 'Bearer ' + tok2}
          # /items/lookup: SKU-only hit
          j = c.get('/mobile/items/lookup?q=' + ca_bc, headers=h1).json()
          assert j['exact'] is not None and j['exact']['id'] == ca_id and j['candidates'] == [], j
          # /items/lookup: ambiguous text -> candidates only
          j = c.get('/mobile/items/lookup?q=Cable', headers=h1).json()
          assert j['exact'] is None and sorted([x['name'] for x in j['candidates']]) == ['Cable A', 'Cable B'], j
          # /items/lookup: single text hit -> exact
          j = c.get('/mobile/items/lookup?q=Widget', headers=h1).json()
          assert j['exact'] is not None and j['exact']['name'] == 'Widget X', j
          # /items/by-barcode falls through to case-insensitive
          assert c.get('/mobile/items/by-barcode/' + ca_bc.lower(), headers=h1).status_code == 200
          # /items/search pagination
          j = c.get('/mobile/items/search?q=cab&limit=1&offset=0', headers=h1).json()
          assert j['total'] == 2 and j['has_more'] is True and len(j['items']) == 1, j
          j = c.get('/mobile/items/search?q=cab&limit=10&offset=1', headers=h1).json()
          assert j['has_more'] is False and len(j['items']) == 1, j
          # Per-tech stock scoping: tech1 at Main sees 10 of Cable A, tech2 at Van sees 0.
          assert c.get('/mobile/items/search?q=Cable+A', headers=h1).json()['items'][0]['in_stock_at_location'] == 10
          assert c.get('/mobile/items/search?q=Cable+A', headers=h2).json()['items'][0]['in_stock_at_location'] == 0
          # /customers/search
          j = c.get('/mobile/customers/search?q=acme', headers=h1).json()
          assert j['total'] == 1 and j['customers'][0]['name'] == 'Acme Corp'
          j = c.get('/mobile/customers/search?limit=1', headers=h1).json()
          assert j['total'] == 2 and j['has_more'] is True
          # /customers/{id}/jobs: empty + create + list
          assert c.get('/mobile/customers/' + str(acme_id) + '/jobs', headers=h1).json() == {'jobs': []}
          r = c.post('/mobile/customers/' + str(acme_id) + '/jobs', json={'name': 'May service call', 'note': 'Emergency'}, headers=h1)
          assert r.status_code == 201, r.text
          job_id = r.json()['id']; assert r.json()['status'] == 'open'
          assert c.get('/mobile/customers/' + str(acme_id) + '/jobs', headers=h1).json()['jobs'][0]['id'] == job_id
          # Unknown customer -> 404 on both list and create. Unauth -> 401.
          assert c.get('/mobile/customers/99999/jobs', headers=h1).status_code == 404
          assert c.post('/mobile/customers/99999/jobs', json={'name': 'x'}, headers=h1).status_code == 404
          assert c.post('/mobile/customers/' + str(acme_id) + '/jobs', json={'name': 'x'}).status_code == 401
          # /locations: tech1 sees Main as default; tech2 sees Van as default.
          j = c.get('/mobile/locations', headers=h1).json()
          d = {l['name']: l['is_default'] for l in j['locations']}
          assert d == {'Main': True, 'Van 3': False}, d
          d = {l['name']: l['is_default'] for l in c.get('/mobile/locations', headers=h2).json()['locations']}
          assert d == {'Main': False, 'Van 3': True}, d
          # /orders with job_id: matching customer ok
          payload = {'client_action_id': 'ord-job-ok', 'customer_id': acme_id, 'location_id': loc_main, 'job_id': job_id, 'lines': [{'item_id': ca_id, 'qty': 1}]}
          r = c.post('/mobile/orders', json=payload, headers=h1)

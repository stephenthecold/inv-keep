          assert 'id=\"cart-tech\"' in page and 'data-required=\"1\"' in page
          assert '<select id=\"cart-tech\"' not in page and 'Scan your badge' in page  # dropdown replaced by the scan prompt
          tok2 = re.search(r'name=\"csrf-token\" content=\"([^\"]+)\"', page).group(1)

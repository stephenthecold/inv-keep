          # 5. Customer by card
          r = c.get('/mobile/customers/by-card/CARD-04A1B2', headers=bh)
          assert r.status_code == 200 and r.json()['id'] == client_id
          assert c.get('/mobile/customers/by-card/UNKNOWN', headers=bh).status_code == 404
          # Mobile routes are CSRF-exempt — POST without _csrf or X-CSRF-Token works
          assert c.post('/mobile/auth/token', json={'pin': '9876'}).status_code == 200
          print('mobile API end-to-end OK')

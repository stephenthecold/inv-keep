      - name: UI/UX regressions (popup money + table-scroll + a11y)
        env:
          DATABASE_URL: "sqlite:///./data/ci_ui.db"
          SESSION_SECRET: "ci-only-secret-not-for-production-padded-out-to-meet-min-length-64"

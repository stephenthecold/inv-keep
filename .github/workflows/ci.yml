          db.add(KioskPin(label='Field tech', pin='9876', kiosk_username='stephen', location_id=loc_id, active=True, badge_uid='04A1B2C3D4E580'))
          db.commit(); pin_id = db.query(KioskPin).order_by(KioskPin.id.desc()).first().id; db.close()
          # 1. Auth by PIN
          r = c.post('/mobile/auth/token', json={'pin': '9876'})
          assert r.status_code == 200, (r.status_code, r.text)
          j = r.json()
          assert j['tech']['id'] == pin_id and j['tech']['default_location_id'] == loc_id
          token = j['token']
          # Auth by badge
          assert c.post('/mobile/auth/token', json={'badge_uid': '04A1B2C3D4E580'}).status_code == 200
          # Wrong PIN
          assert c.post('/mobile/auth/token', json={'pin': '0000'}).status_code == 401
          # No credentials
          assert c.post('/mobile/auth/token', json={}).status_code == 401
          bh = {'Authorization': 'Bearer ' + token}
          # No-auth call rejected
          assert c.get('/mobile/items/by-barcode/' + barcode).status_code == 401
          # 2. Item by barcode
          r = c.get('/mobile/items/by-barcode/' + barcode, headers=bh)

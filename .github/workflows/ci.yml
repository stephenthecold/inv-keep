          db = SessionLocal()
          assert db.get(Order, r.json()['order_id']).job_id == job_id
          db.close()
          # /orders with job_id: mismatched customer -> 422
          mis = {**payload, 'client_action_id': 'ord-job-bad', 'customer_id': beta_id}
          r = c.post('/mobile/orders', json=mis, headers=h1)
          assert r.status_code == 422 and r.json()['detail']['error'] == 'job_mismatch', r.json()
          # /receipts: tiny valid PNG
          PNG = bytes.fromhex('89504E470D0A1A0A0000000D49484452000000010000000108060000001F15C4890000000D49444154789C636060606000000005000150A0F8DA0000000049454E44AE426082')
          r = c.post('/mobile/receipts', files={'image': ('r.png', io.BytesIO(PNG), 'image/png')}, headers=h1)
          assert r.status_code == 201, r.text
          receipt_id = r.json()['receipt_id']
          assert receipt_id.startswith('rcpt_') and r.json()['url'].startswith('/uploads/receipts/')
          # /receipts: non-image rejected
          assert c.post('/mobile/receipts', files={'image': ('x.gif', io.BytesIO(b'GIF89a'), 'image/gif')}, headers=h1).status_code == 415
          # /receipts: >5MB rejected
          big = b'\\x00' * (5 * 1024 * 1024 + 1024)
          assert c.post('/mobile/receipts', files={'image': ('big.png', io.BytesIO(big), 'image/png')}, headers=h1).status_code == 413
          # /orders with custom line: round-trip name + price + receipt_id
          payload = {'client_action_id': 'ord-custom-1', 'customer_id': acme_id, 'location_id': loc_main,
                     'lines': [{'item_id': ca_id, 'qty': 1},
                               {'type': 'custom', 'name': 'USB-C cable - Home Depot', 'qty': 2, 'unit_price_cents': 1299, 'receipt_id': receipt_id}]}
          r = c.post('/mobile/orders', json=payload, headers=h1)
          assert r.status_code == 201, r.text
          oid = r.json()['order_id']
          db = SessionLocal()
          lines = db.query(Transaction).filter(Transaction.order_id == oid).order_by(Transaction.id).all()
          assert len(lines) == 2
          cat_ln, cus_ln = lines
          assert cat_ln.part.name == 'Cable A'
          assert cus_ln.part.name == 'USB-C cable - Home Depot' and cus_ln.quantity == 2
          assert cus_ln.part.archived is True and cus_ln.part.barcode.startswith('CUSTOM-')
          assert float(cus_ln.unit_price_at_time) == 12.99
          assert cus_ln.receipt_id == receipt_id
          db.close()
          # Custom line missing required fields -> 422
          bad = {**payload, 'client_action_id': 'oc-bad-1', 'lines': [{'type': 'custom', 'qty': 1, 'unit_price_cents': 100}]}
          assert c.post('/mobile/orders', json=bad, headers=h1).status_code == 422
          bad = {**payload, 'client_action_id': 'oc-bad-2', 'lines': [{'type': 'custom', 'name': 'x', 'qty': 1}]}
          assert c.post('/mobile/orders', json=bad, headers=h1).status_code == 422
          # Cross-tech receipt rejected (tech1 cannot reference a tech2 receipt)
          r2 = c.post('/mobile/receipts', files={'image': ('r2.png', io.BytesIO(PNG), 'image/png')}, headers=h2).json()['receipt_id']
          bad = {**payload, 'client_action_id': 'oc-bad-3',
                 'lines': [{'type': 'custom', 'name': 'x', 'qty': 1, 'unit_price_cents': 100, 'receipt_id': r2}]}
          r = c.post('/mobile/orders', json=bad, headers=h1)
          assert r.status_code == 422 and r.json()['detail']['error'] == 'unknown_receipt', r.json()
          # CSRF exemption holds for every new route (no token -> 401, not 403/csrf)
          assert c.post('/mobile/customers/' + str(acme_id) + '/jobs', json={'name': 'x'}).status_code == 401
          assert c.post('/mobile/receipts', files={'image': ('r.png', io.BytesIO(PNG), 'image/png')}).status_code == 401
          print('mobile API extended OK')
          "
      - name: Check JavaScript syntax
        run: node --check app/static/app.js
      - name: Lint shell installer
        run: bash -n install.sh
